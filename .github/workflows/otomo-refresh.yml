name: ŌTOMO · On-Demand Catalog Refresh

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "刷新模式（full=全量重抓；incremental=增量追加）"
        required: false
        default: "incremental"
        type: choice
        options:
          - incremental
          - full

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run OTOMO refresh script
        run: |
          python3 OOTD/tools/online_refresh.py --mode "${{ github.event.inputs.mode }}"

      - name: Commit & push
        run: |
          git config user.name "otomo-bot"
          git config user.email "otomo@users.noreply.github.com"
          git add OOTD/data/outfit_archive.json
          if git diff --cached --quiet; then
            echo "No catalog changes, skipping commit."
            exit 0
          fi
          git commit -m "chore(OOTD): online refresh @ $(date -u +%Y-%m-%dT%H:%MZ) [skip ci]"
          git pull --rebase origin main
          git push origin main
