* { margin:0; padding:0; box-sizing:border-box; }

.exercise-card { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:1.25rem; margin-bottom:0.75rem; }
.exercise-card .name { font-size:1.1rem; font-weight:700; color:var(--white); margin-bottom:0.3rem; }
.exercise-card .muscle { font-size:0.75rem; color:var(--accent); margin-bottom:0.5rem; }
.exercise-card .detail { font-size:0.9rem; color:var(--text-dim); margin-bottom:0.5rem; }
.exercise-card .tips { font-size:0.8rem; color:var(--text-muted); }
.exercise-card .tips li { margin-bottom:0.2rem; }
.exercise-card .strategy { display:inline-block; font-size:0.7rem; padding:0.15rem 0.5rem; border-radius:4px; margin-top:0.5rem; }
.exercise-card .strategy.consolidate { background:rgba(74,222,128,0.1); color:var(--green); }
.exercise-card .strategy.probe { background:rgba(249,115,22,0.1); color:var(--accent); }
.cardio-table { width:100%; border-collapse:collapse; font-size:0.9rem; }
.cardio-table th { text-align:left; padding:0.6rem; color:var(--text-muted); font-weight:500; border-bottom:1px solid var(--border); font-size:0.75rem; text-transform:uppercase; }
.cardio-table td { padding:0.6rem; border-bottom:1px solid var(--border); color:var(--text-dim); }
.feedback-link { display:block; text-align:center; background:var(--accent); color:var(--white); text-decoration:none; padding:1rem; border-radius:10px; font-weight:700; margin-top:2rem; transition:opacity 0.2s; }
.feedback-link:hover { opacity:0.9; }
.notice { background:rgba(249,115,22,0.08); border:1px solid rgba(249,115,22,0.2); border-radius:10px; padding:1rem; font-size:0.85rem; color:var(--text-dim); margin-bottom:1.5rem; }
.notice strong { color:var(--accent); }
.warmup { background:rgba(96,165,250,0.05); border:1px solid rgba(96,165,250,0.15); border-radius:10px; padding:1rem; margin-bottom:1.5rem; }
.warmup-title { font-size:0.8rem; color:#60a5fa; font-weight:700; margin-bottom:0.5rem; }
.badge { display:inline-block; font-size:0.7rem; padding:0.1rem 0.4rem; border-radius:4px; background:rgba(74,222,128,0.1); color:var(--green); margin-left:0.3rem; }
@media (max-width:600px) { .container { padding:1.5rem 1rem; } }
