<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ŌTOMO · 男装穿搭灵感</title>
<meta name="description" content="ŌTOMO — 每周一次，基于上海天气的男装穿搭灵感推送。支持最多 5 个单品并行搜索。">
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
        --bg: #0f0f0f;
        --surface: #181818;
        --surface-2: #1f1f1f;
        --border: #262626;
        --border-hover: #3a3a3a;
        --text: #f0f0f0;
        --text-dim: #9a9a9a;
        --text-muted: #5e5e5e;
        --accent: #d9b37a;
        --accent-soft: rgba(217,179,122,0.12);
    }

    body {
        font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', 'PingFang SC', 'Noto Sans CJK SC', sans-serif;
        background: var(--bg);
        color: var(--text);
        min-height: 100vh;
        padding: 0 0 11rem; /* 底部留给固定反馈栏（多行） */
        line-height: 1.5;
    }

    /* ═══ Top Nav（sticky 顶部，内容和下方 container 左对齐）═══ */
    .topnav {
        position: sticky;
        top: 0;
        z-index: 90;
        background: rgba(15,15,15,0.92);
        backdrop-filter: saturate(180%) blur(14px);
        -webkit-backdrop-filter: saturate(180%) blur(14px);
        border-bottom: 1px solid var(--border);
    }
    .topnav-inner {
        max-width: 1320px;
        margin: 0 auto;
        padding: 0.7rem 1rem;
        display: flex;
        align-items: center;
        gap: 0.8rem;
    }
    .topnav a.nav-link {
        font-size: 0.78rem;
        color: var(--text-dim);
        text-decoration: none;
        letter-spacing: 0.05em;
        padding: 4px 10px;
        border: 1px solid var(--border);
        border-radius: 999px;
        transition: all 0.2s;
    }
    .topnav a.nav-link:hover { color: var(--text); border-color: var(--border-hover); }
    .topnav a.nav-link.primary { color: var(--accent); border-color: rgba(217,179,122,0.35); }
    .topnav .spacer { flex: 1; }
    .topnav .nav-brand {
        font-size: 0.82rem;
        color: var(--text-muted);
        letter-spacing: 0.08em;
    }

    /* ═══ Refresh Actions（方向词刷新 + 图片刷新）═══ */
    .refresh-row {
        display: flex;
        gap: 0.5rem;
        flex-wrap: wrap;
        margin-top: 1rem;
    }
    .refresh-btn {
        display: inline-flex;
        align-items: center;
        gap: 0.3rem;
        padding: 0.5rem 0.9rem;
        font-size: 0.78rem;
        font-weight: 500;
        letter-spacing: 0.03em;
        background: var(--surface);
        color: var(--text-dim);
        border: 1px solid var(--border);
        border-radius: 8px;
        cursor: pointer;
        transition: all 0.2s;
    }
    .refresh-btn:hover {
        color: var(--text);
        border-color: var(--accent);
        background: var(--accent-soft);
    }
    .refresh-btn .ico { font-size: 0.9rem; }
    .refresh-btn.loading { opacity: 0.5; pointer-events: none; }
    .refresh-btn.primary {
        color: var(--accent);
        border-color: rgba(217,179,122,0.35);
    }

    .container { max-width: 1320px; margin: 0 auto; padding: 1.5rem 1rem 0; }

    /* ═══ Header ═══ */
    .header {
        border-bottom: 1px solid var(--border);
        padding-bottom: 1.25rem;
        margin-bottom: 1.5rem;
    }

    .brand-row {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 1rem;
        flex-wrap: wrap;
    }

    .brand {
        font-size: 1.6rem;
        font-weight: 700;
        letter-spacing: 0.08em;
        color: var(--text);
    }
    .brand .accent { color: var(--accent); }

    .meta-row {
        display: flex;
        gap: 1.5rem;
        margin-top: 0.8rem;
        font-size: 0.78rem;
        color: var(--text-dim);
        flex-wrap: wrap;
    }
    .meta-row .chip {
        padding: 4px 10px;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 999px;
    }
    .meta-row .chip strong { color: var(--text); font-weight: 600; margin-left: 4px; }

    .trigger-banner {
        margin-top: 0.9rem;
        padding: 0.6rem 0.9rem;
        background: var(--accent-soft);
        border-left: 3px solid var(--accent);
        border-radius: 4px;
        font-size: 0.82rem;
        color: var(--text);
    }
    .trigger-banner strong { color: var(--accent); letter-spacing: 0.05em; }

    /* ═══ 审核不足 Banner（v2.3）═══ */
    .review-banner {
        margin-top: 0.6rem;
        padding: 0.55rem 0.9rem;
        background: rgba(217, 108, 70, 0.12);
        border: 1px solid rgba(217, 108, 70, 0.4);
        border-left: 3px solid #d96c46;
        border-radius: 4px;
        font-size: 0.8rem;
        color: #f0d3c5;
        display: none;
    }
    .review-banner.show { display: block; }
    .review-banner strong { color: #ffb395; letter-spacing: 0.03em; }
    .review-banner .review-meta {
        color: #c9a798;
        font-size: 0.72rem;
        margin-left: 0.4rem;
    }

    /* ═══ Masonry ═══ */
    .masonry {
        column-count: 3;
        column-gap: 1rem;
    }
    @media (max-width: 900px) { .masonry { column-count: 2; } }
    @media (max-width: 600px) { .masonry { column-count: 1; } }

    .card {
        break-inside: avoid;
        margin-bottom: 1rem;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 10px;
        overflow: hidden;
        transition: border-color 0.2s, transform 0.2s;
    }
    .card:hover { border-color: var(--border-hover); transform: translateY(-2px); }

    .card img {
        display: block;
        width: 100%;
        height: auto;
        background: #111;
    }

    .card-meta { padding: 0.7rem 0.85rem 0.85rem; }
    .card-tags {
        display: flex;
        gap: 0.35rem;
        align-items: center;
        flex-wrap: wrap;
        margin-bottom: 0.35rem;
    }
    .source-tag {
        font-size: 0.62rem;
        padding: 2px 7px;
        border-radius: 4px;
        letter-spacing: 0.05em;
        font-weight: 600;
    }
    .source-Lookbook     { background: rgba(217,179,122,0.14); color: #d9b37a; border: 1px solid rgba(217,179,122,0.25); }
    .source-时装周街拍    { background: rgba(147,197,253,0.12); color: #93c5fd; border: 1px solid rgba(147,197,253,0.22); }
    .source-秀场         { background: rgba(196,181,253,0.12); color: #c4b5fd; border: 1px solid rgba(196,181,253,0.22); }
    .source-日本街拍      { background: rgba(244,114,182,0.12); color: #f472b6; border: 1px solid rgba(244,114,182,0.22); }
    .source-时装周        { background: rgba(147,197,253,0.12); color: #93c5fd; border: 1px solid rgba(147,197,253,0.22); }

    .query-tag {
        font-size: 0.62rem;
        padding: 2px 7px;
        border-radius: 4px;
        background: rgba(240,240,240,0.06);
        color: var(--text-dim);
        border: 1px solid var(--border);
        letter-spacing: 0.03em;
    }

    .year-tag {
        font-size: 0.62rem;
        color: var(--text-muted);
        letter-spacing: 0.05em;
        margin-left: auto;
    }

    .brand-label {
        font-size: 0.8rem;
        color: var(--text);
        font-weight: 500;
    }

    .empty {
        text-align: center;
        padding: 3rem 1rem;
        color: var(--text-muted);
        font-size: 0.9rem;
    }

    /* ═══ Feedback Bar (固定底部 · 5 输入框)═══ */
    .feedback {
        position: fixed;
        bottom: 0; left: 0; right: 0;
        background: rgba(15,15,15,0.94);
        backdrop-filter: saturate(180%) blur(14px);
        -webkit-backdrop-filter: saturate(180%) blur(14px);
        border-top: 1px solid var(--border);
        padding: 0.65rem 1rem 0.8rem;
        z-index: 100;
    }
    .feedback-inner {
        max-width: 1320px;
        margin: 0 auto;
    }

    .recent-row {
        display: flex;
        gap: 0.4rem;
        align-items: center;
        flex-wrap: wrap;
        margin-bottom: 0.45rem;
    }
    .recent-row .label {
        font-size: 0.7rem;
        color: var(--text-muted);
        letter-spacing: 0.05em;
        margin-right: 0.2rem;
    }
    .recent-combo {
        display: inline-flex;
        gap: 3px;
        padding: 3px 8px;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 999px;
        cursor: pointer;
        transition: all 0.2s;
        max-width: 100%;
        overflow: hidden;
        white-space: nowrap;
    }
    .recent-combo:hover { border-color: var(--border-hover); }
    .recent-combo .item {
        font-size: 0.7rem;
        color: var(--text-dim);
    }
    .recent-combo .item + .item::before {
        content: ' · ';
        color: var(--text-muted);
        margin: 0 2px;
    }

    .input-row {
        display: grid;
        grid-template-columns: repeat(5, 1fr) auto;
        gap: 0.5rem;
        align-items: center;
    }
    @media (max-width: 900px) {
        .input-row { grid-template-columns: repeat(2, 1fr); }
        .input-row button { grid-column: 1 / -1; }
    }
    @media (max-width: 500px) {
        .input-row { grid-template-columns: 1fr; }
    }
    .feedback input {
        min-width: 0;
        background: var(--surface-2);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 0.6rem 0.8rem;
        color: var(--text);
        font-size: 0.85rem;
        outline: none;
    }
    .feedback input:focus { border-color: var(--accent); }
    .feedback input::placeholder { color: var(--text-muted); font-size: 0.78rem; }

    .feedback button {
        background: var(--accent);
        color: #1a1a1a;
        border: none;
        border-radius: 8px;
        padding: 0.6rem 1.2rem;
        font-weight: 600;
        font-size: 0.85rem;
        cursor: pointer;
        letter-spacing: 0.03em;
        transition: opacity 0.2s;
        white-space: nowrap;
    }
    .feedback button:hover { opacity: 0.88; }

    .footer {
        margin-top: 2.5rem;
        padding-top: 1rem;
        border-top: 1px solid var(--border);
        display: flex;
        justify-content: space-between;
        flex-wrap: wrap;
        gap: 0.5rem;
        font-size: 0.72rem;
        color: var(--text-muted);
        letter-spacing: 0.03em;
    }

    .toast {
        position: fixed;
        top: 4rem; left: 50%;
        transform: translateX(-50%);
        background: var(--surface);
        border: 1px solid var(--accent);
        color: var(--text);
        padding: 0.7rem 1.1rem;
        border-radius: 8px;
        font-size: 0.82rem;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.3s;
        z-index: 200;
        max-width: 90%;
        line-height: 1.5;
    }
    .toast.show { opacity: 1; }
</style>
</head>
<body>

<!-- 顶部导航 · 与下方 container 左对齐（max-width 1320px + 同样 padding）-->
<nav class="topnav">
    <div class="topnav-inner">
        <a class="nav-link primary" href="https://ego1013.github.io/ethanycjin/">← Ethan's Lab</a>
        <div class="spacer"></div>
        <span class="nav-brand">ŌTOMO · OOTD</span>
    </div>
</nav>

<div class="container">
    <div class="header">
        <div class="brand-row">
            <div class="brand">Ō<span class="accent">TOMO</span> · 男装穿搭灵感</div>
        </div>
        <div class="meta-row">
            <div class="chip">日期<strong id="today"></strong></div>
            <div class="chip">上海<strong id="weather"></strong></div>
            <div class="chip">方向<strong id="direction"></strong></div>
        </div>
        <div class="trigger-banner"><strong id="triggerLabel">本周推送</strong> · <span id="triggerNote">基于当日天气精选</span></div>
        <div class="review-banner" id="reviewBanner">
            ⚠️ <strong>本期图片数量有限</strong>（<span id="reviewActual">—</span>/<span id="reviewTarget">—</span> 张），审核三轮后仍不达标，下一期将补足。
            <span class="review-meta" id="reviewMeta"></span>
        </div>
        <div class="refresh-row">
            <button class="refresh-btn primary" id="refreshDirectionBtn" title="重新生成风格方向词，瀑布流全部刷新">
                <span class="ico">🎯</span><span>换方向词</span>
            </button>
            <button class="refresh-btn" id="refreshImagesBtn" title="方向不变，整页重新抽取新图（离线 · 从 catalog 池）">
                <span class="ico">🔄</span><span>换一批图</span>
            </button>
            <button class="refresh-btn" id="refreshOnlineBtn" title="触发 GitHub Actions 真实抓取新图 · 约 1-2 分钟">
                <span class="ico">🛰️</span><span>在线重搜</span>
            </button>
        </div>
    </div>

    <div class="masonry" id="masonry"></div>

    <div class="footer">
        <span>已归档 <strong id="totalCount">0</strong> 套穿搭</span>
        <span>最后更新 <span id="lastUpdate">—</span></span>
    </div>
</div>

<!-- 固定底部反馈栏 · 5 输入框 -->
<div class="feedback">
    <div class="feedback-inner">
        <div class="recent-row" id="recentRow">
            <span class="label">最近搜索</span>
        </div>
        <div class="input-row">
            <input id="q1" type="text" placeholder="单品 1，如：米色直筒工装裤" />
            <input id="q2" type="text" placeholder="单品 2" />
            <input id="q3" type="text" placeholder="单品 3" />
            <input id="q4" type="text" placeholder="单品 4" />
            <input id="q5" type="text" placeholder="单品 5" />
            <button id="searchBtn">立即搜索</button>
        </div>
    </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ═══════════════════════════════════════════════════════════════
 * ŌTOMO Frontend Logic · v2
 * - 5-input multi-item search (up to 5 关键词并行)
 * - 每张卡片显示对应的触发单品 tag
 * - 最近 5 次搜索以 tag 组合形式展示
 * - 图片均匀穿插（同一单品连续出现不超过 2 张）
 * - 数据源：./data/outfit_archive.json
 * ═══════════════════════════════════════════════════════════════ */

const ARCHIVE_URL = './data/outfit_archive.json';
const RECENT_KEY  = 'otomo_recent_combos_v2';

/* ═══ 在线重搜（A 方案）═══
 * 部署好 Cloudflare Worker 后，把 URL 填在这里。留空 → 隐藏按钮。
 * 详见 docs/deploy-online-refresh.md
 */
const WORKER_REFRESH_URL = ''; // e.g. 'https://otomo-refresh-proxy.ethanycjin.workers.dev'
const POLL_INTERVAL_MS = 5000;
const POLL_TIMEOUT_MS  = 3 * 60 * 1000;

let archiveData = null;
let currentDirection = null;   // 当前使用的方向词（初始 = 最新 push 的 direction_keywords）
let currentShuffleSeed = 0;    // 换图时递增，用于打散顺序

/* ═══ 方向词池（按温度分层，前端兜底；未来会由自动化写入 archive）═══ */
const DIRECTION_POOL = {
    cold: [   // ≤10°C
        ['heavy layering', 'wool overcoat', 'archive outerwear'],
        ['chunky knit', 'relaxed trouser', 'earth tone'],
        ['military parka', 'cargo', 'utility'],
        ['tailored coat', 'turtleneck', 'monochrome'],
    ],
    cool: [   // 11-18°C
        ['light layering', 'spring transitional', 'earth tone minimalist'],
        ['unstructured blazer', 'wide pant', 'quiet luxury'],
        ['workwear jacket', 'denim', 'japanese street'],
        ['knit vest', 'oxford shirt', 'prep-ivy'],
    ],
    mild: [   // 19-24°C
        ['soft tailoring', 'linen shirt', 'muted palette'],
        ['boxy tee', 'pleated pant', 'tokyo archive'],
        ['overshirt', 'relaxed chino', 'workwear japan'],
        ['knit polo', 'silk trouser', 'resort smart'],
    ],
    warm: [   // ≥25°C
        ['breathable linen', 'open collar', 'beach tailoring'],
        ['short sleeve shirt', 'wide short', 'summer japan'],
        ['mesh knit', 'drawstring trouser', 'sport luxe'],
        ['camp collar', 'pleated short', 'riviera'],
    ],
};

function pickDirectionByTemp(tempC) {
    let pool;
    if (tempC <= 10)      pool = DIRECTION_POOL.cold;
    else if (tempC <= 18) pool = DIRECTION_POOL.cool;
    else if (tempC <= 24) pool = DIRECTION_POOL.mild;
    else                  pool = DIRECTION_POOL.warm;
    // 避免连续两次同一组
    let next;
    do { next = pool[Math.floor(Math.random() * pool.length)]; }
    while (currentDirection && next.join('/') === currentDirection.join('/') && pool.length > 1);
    return next;
}

/* ─── utils ─── */
const pad = n => String(n).padStart(2, '0');
const fmtDate = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const fmtDateTime = d => `${fmtDate(d)} ${pad(d.getHours())}:${pad(d.getMinutes())}`;

function showToast(msg, ms=3200) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(showToast._t);
    showToast._t = setTimeout(()=>t.classList.remove('show'), ms);
}

/* ─── render ─── */
function renderCards(items) {
    const el = document.getElementById('masonry');
    el.innerHTML = '';
    if (!items.length) {
        el.innerHTML = '<div class="empty">没有匹配到图片 · 请尝试其他关键词</div>';
        return;
    }
    items.forEach(it => {
        const card = document.createElement('div');
        card.className = 'card';
        const srcClass = (it.source_type || 'Lookbook').replace(/\s/g,'');
        const queryTag = it.query_tag
            ? `<span class="query-tag">#${it.query_tag}</span>` : '';
        card.innerHTML = `
            <img src="${it.url}?w=700&q=80&auto=format&fit=crop" loading="lazy" alt="${it.brand_or_event}">
            <div class="card-meta">
                <div class="card-tags">
                    <span class="source-tag source-${srcClass}">${it.source_type}</span>
                    ${queryTag}
                    <span class="year-tag">${it.year}</span>
                </div>
                <div class="brand-label">${it.brand_or_event}</div>
            </div>`;
        el.appendChild(card);
    });
}

function renderHeader(push, overrides) {
    const now = new Date();
    document.getElementById('today').textContent = fmtDate(now);

    const w = push.weather;
    document.getElementById('weather').textContent =
        `${w.condition} · ${w.temp_c}°C · 体感 ${w.feels_like_c}°C`;
    document.getElementById('direction').textContent =
        (overrides && overrides.direction) || w.direction_keywords.join(' / ');

    if (overrides && overrides.triggerLabel) {
        document.getElementById('triggerLabel').textContent = overrides.triggerLabel;
        document.getElementById('triggerNote').textContent  = overrides.triggerNote || '';
    } else {
        document.getElementById('triggerLabel').textContent =
            push.push_type === 'scheduled' ? '本周推送' : '手动搜索';
        document.getElementById('triggerNote').textContent =
            push.push_type === 'scheduled' ? '基于当日天气精选' : '刷新全部瀑布流';
    }

    document.getElementById('totalCount').textContent =
        Object.keys(archiveData.catalog || {}).length;
    document.getElementById('lastUpdate').textContent = fmtDateTime(now);
}

/* ─── data ─── */
function loadArchive() {
    return fetch(ARCHIVE_URL, {cache:'no-store'})
        .then(r => r.json())
        .then(d => { archiveData = d; return d; });
}

/* ─── v2.3 审核不足 Banner ─── */
function renderReviewBanner() {
    const review = archiveData?.meta?.review;
    const banner = document.getElementById('reviewBanner');
    if (!banner) return;
    if (!review || !review.enabled || !review.insufficient) {
        banner.classList.remove('show');
        return;
    }
    document.getElementById('reviewActual').textContent = review.published ?? '—';
    document.getElementById('reviewTarget').textContent = review.target ?? '—';
    const metaParts = [];
    if (review.rounds) metaParts.push(`审核 ${review.rounds} 轮`);
    if (review.total_rejected) metaParts.push(`驳回 ${review.total_rejected} 张`);
    if (review.last_run) metaParts.push(review.last_run.slice(0, 10));
    document.getElementById('reviewMeta').textContent =
        metaParts.length ? '· ' + metaParts.join(' · ') : '';
    banner.classList.add('show');
}
function pickLatestPush() {
    const ps = archiveData.pushes || [];
    return ps.length ? ps[ps.length - 1] : null;
}

function renderLatest(opts={}) {
    const push = pickLatestPush();
    if (!push) {
        document.getElementById('masonry').innerHTML = '<div class="empty">归档为空</div>';
        return;
    }

    // 决定当前方向词
    if (!currentDirection || opts.newDirection) {
        const tempC = push.weather?.temp_c ?? 20;
        currentDirection = opts.newDirection
            ? pickDirectionByTemp(tempC)
            : (push.weather?.direction_keywords || pickDirectionByTemp(tempC));
    }

    // 决定图片池
    let items = push.items.map(id => archiveData.catalog[id]).filter(Boolean);
    const allCatalog = Object.values(archiveData.catalog || {});

    // 方向词变了 → 按方向词从 catalog 重新召回（模糊匹配 tags / brand / query_tag）
    if (opts.newDirection) {
        const dirLower = currentDirection.map(d => d.toLowerCase());
        const matched = allCatalog.filter(it => {
            const hay = (
                (it.tags||[]).join(' ') + ' ' +
                (it.brand_or_event||'') + ' ' +
                (it.query_tag||'') + ' ' +
                (it.source_type||'')
            ).toLowerCase();
            return dirLower.some(d => hay.includes(d));
        });
        // 匹配不到时从整个 catalog 抽
        items = matched.length >= 8 ? matched : allCatalog;
    }

    // 换一批图：整页 shuffle（保证和上一次顺序不同）
    if (opts.shuffle) {
        currentShuffleSeed++;
        items = shuffle(items.length ? items : allCatalog);
    }

    // 总量 12-18
    const finalItems = items.slice(0, 18);

    // Header 渲染
    const label = opts.newDirection ? '方向已换' : opts.shuffle ? '换了一批图' : (push.push_type === 'scheduled' ? '本周推送' : '手动搜索');
    const note  = opts.newDirection ? '重新匹配瀑布流 · ' + finalItems.length + ' 张'
               : opts.shuffle ? '顺序已打散 · ' + finalItems.length + ' 张'
               : '基于当日天气精选';
    renderHeader(
        { push_type: push.push_type, weather: push.weather },
        { triggerLabel: label, triggerNote: note, direction: currentDirection.join(' / ') }
    );
    renderCards(finalItems);
}

function shuffle(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
}

/* ─── multi-keyword search（单品模式 · 最多 5 个）─── */
function searchByKeywords(keywords) {
    const qs = keywords.map(k => (k||'').trim()).filter(Boolean).slice(0, 5);
    if (!qs.length) { renderLatest(); return; }

    const all = Object.values(archiveData.catalog);

    // 每个关键词独立召回
    const buckets = qs.map(q => {
        const ql = q.toLowerCase();
        const hit = all.filter(it => {
            const hay = (
                it.brand_or_event + ' ' +
                (it.tags||[]).join(' ') + ' ' +
                (it.query_tag||'')
            ).toLowerCase();
            return hay.includes(ql);
        }).map(it => ({...it, query_tag: q}));
        return { query: q, items: hit };
    });

    // 每个单品目标 3-4 张；不足时从 catalog 随机补
    const TARGET = 3;
    buckets.forEach(b => {
        if (b.items.length < TARGET) {
            const pool = all.filter(it => !b.items.find(x=>x.url===it.url));
            const needed = TARGET - b.items.length;
            const extra = pool.slice(0, needed).map(it => ({...it, query_tag: b.query}));
            b.items = b.items.concat(extra);
        }
        b.items = b.items.slice(0, 4); // 最多 4 张
    });

    // 均匀穿插：round-robin，避免同一单品连续出现超过 2 张
    const interleaved = [];
    const max = Math.max(...buckets.map(b => b.items.length));
    for (let i = 0; i < max; i++) {
        buckets.forEach(b => {
            if (b.items[i]) interleaved.push(b.items[i]);
        });
    }
    // 总量控制在 12-18 之间
    const finalItems = interleaved.slice(0, 18);

    // Header
    const baseWeather = pickLatestPush().weather;
    renderHeader(
        { push_type:'manual', weather: baseWeather },
        { triggerLabel: `单品搜索 · ${qs.length} 个关键词`,
          triggerNote: qs.join(' / ') + ` · 命中 ${finalItems.length} 张`,
          direction: qs.join(' / ') }
    );
    renderCards(finalItems);

    pushRecentCombo(qs);

    const totalHit = buckets.reduce((s,b) => s + b.items.filter(it => !it.__extra).length, 0);
    if (buckets.some(b => b.items.length < 3)) {
        showToast('部分单品归档不足，已用相近风格补足。自动化推送会逐步扩充真实 Lookbook / 街拍图库。');
    }
}

/* ─── recent combos ─── */
function getRecent() {
    try { return JSON.parse(localStorage.getItem(RECENT_KEY) || '[]'); }
    catch(e) { return []; }
}
function pushRecentCombo(arr) {
    const key = arr.join('|');
    let list = getRecent().filter(x => x.join('|') !== key);
    list.unshift(arr);
    list = list.slice(0, 5);
    localStorage.setItem(RECENT_KEY, JSON.stringify(list));
    renderRecent();
}
function renderRecent() {
    const row = document.getElementById('recentRow');
    row.querySelectorAll('.recent-combo').forEach(n => n.remove());
    getRecent().forEach(combo => {
        const el = document.createElement('span');
        el.className = 'recent-combo';
        el.innerHTML = combo.map(q => `<span class="item">${q}</span>`).join('');
        el.onclick = () => {
            ['q1','q2','q3','q4','q5'].forEach((id,i) => {
                document.getElementById(id).value = combo[i] || '';
            });
            searchByKeywords(combo);
        };
        row.appendChild(el);
    });
}

/* ─── bootstrap ─── */
document.addEventListener('DOMContentLoaded', async () => {
    try {
        await loadArchive();
        renderLatest();
        renderRecent();
        renderReviewBanner();
        if (Object.keys(archiveData.catalog || {}).length > 500) {
            showToast('归档已超过 500 条，可以考虑整理历史推送。');
        }
    } catch (e) {
        document.getElementById('masonry').innerHTML =
            '<div class="empty">数据加载失败：' + e.message + '</div>';
    }

    document.getElementById('searchBtn').onclick = () => {
        const kws = ['q1','q2','q3','q4','q5']
            .map(id => document.getElementById(id).value);
        searchByKeywords(kws);
    };
    ['q1','q2','q3','q4','q5'].forEach(id => {
        document.getElementById(id).addEventListener('keydown', e => {
            if (e.key === 'Enter') document.getElementById('searchBtn').click();
        });
    });

    // 🎯 换方向词 · 重新采样方向 + 瀑布流全部刷新
    document.getElementById('refreshDirectionBtn').onclick = (ev) => {
        const btn = ev.currentTarget;
        btn.classList.add('loading');
        currentDirection = null; // 强制重抽
        setTimeout(() => {
            renderLatest({ newDirection: true });
            btn.classList.remove('loading');
            showToast('已更新方向词：' + currentDirection.join(' / '));
        }, 150);
    };

    // 🔄 换一批图 · 方向不变，整页打散重抽
    document.getElementById('refreshImagesBtn').onclick = (ev) => {
        const btn = ev.currentTarget;
        btn.classList.add('loading');
        setTimeout(() => {
            renderLatest({ shuffle: true });
            btn.classList.remove('loading');
            showToast('已刷新全部图片顺序（' + Object.keys(archiveData.catalog||{}).length + ' 张候选）');
        }, 150);
    };

    // 🛰️ 在线重搜 · 触发 GitHub Actions 真实抓取（A 方案）
    const onlineBtn = document.getElementById('refreshOnlineBtn');
    if (!WORKER_REFRESH_URL) {
        onlineBtn.style.display = 'none';  // 未配置 Worker 时隐藏
    } else {
        onlineBtn.onclick = async (ev) => {
            const btn = ev.currentTarget;
            btn.classList.add('loading');
            showToast('正在触发在线抓取…');

            try {
                const resp = await fetch(WORKER_REFRESH_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ mode: 'incremental' }),
                });
                if (!resp.ok && resp.status !== 202) {
                    const err = await resp.json().catch(() => ({}));
                    throw new Error(err.error || `HTTP ${resp.status}`);
                }
                showToast('已触发 GitHub Actions，约 1-2 分钟，正在轮询新图…', 5000);
                await pollForNewArchive();
            } catch (e) {
                showToast('在线重搜失败：' + e.message, 5000);
                btn.classList.remove('loading');
            }
        };
    }
});

/* ─── 轮询 outfit_archive.json，等待 last_push_online 变化 ─── */
async function pollForNewArchive() {
    const btn = document.getElementById('refreshOnlineBtn');
    const before = archiveData?.meta?.last_push_online || '';
    const deadline = Date.now() + POLL_TIMEOUT_MS;

    while (Date.now() < deadline) {
        await new Promise(r => setTimeout(r, POLL_INTERVAL_MS));
        try {
            const resp = await fetch(ARCHIVE_URL + '?t=' + Date.now(), { cache: 'no-store' });
            const fresh = await resp.json();
            const after = fresh.meta?.last_push_online || '';
            if (after && after !== before) {
                archiveData = fresh;
                const latest = fresh.pushes[fresh.pushes.length - 1];
                const addedN = latest?.item_count || 0;
                currentDirection = null;  // 强制下次用新 direction
                renderLatest();
                renderReviewBanner();
                btn.classList.remove('loading');
                showToast(`✨ 在线抓取完成 · 新增 ${addedN} 张 · 归档共 ${Object.keys(fresh.catalog).length} 张`, 5000);
                return;
            }
        } catch (e) {
            // 轮询期间的临时失败忽略
        }
    }
    btn.classList.remove('loading');
    showToast('在线抓取超时（3 分钟未检测到更新），请查 GitHub Actions 日志', 6000);
}
