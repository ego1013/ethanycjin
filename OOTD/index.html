<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ŌTOMO · 男装穿搭灵感</title>
<meta name="description" content="ŌTOMO — 每周一次，基于上海天气的男装穿搭灵感推送。">
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
        --bg: #0f0f0f;
        --surface: #181818;
        --surface-2: #1f1f1f;
        --border: #262626;
        --border-hover: #3a3a3a;
        --text: #f0f0f0;
        --text-dim: #9a9a9a;
        --text-muted: #5e5e5e;
        --accent: #d9b37a; /* warm earth tone, 呼应 OOTD 调性 */
        --accent-soft: rgba(217,179,122,0.12);
    }

    body {
        font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', 'PingFang SC', 'Noto Sans CJK SC', sans-serif;
        background: var(--bg);
        color: var(--text);
        min-height: 100vh;
        padding: 1.5rem 1rem 7rem; /* 底部留给固定反馈栏 */
        line-height: 1.5;
    }

    .container { max-width: 1320px; margin: 0 auto; }

    /* ═══ Header ═══ */
    .header {
        border-bottom: 1px solid var(--border);
        padding-bottom: 1.25rem;
        margin-bottom: 1.5rem;
    }

    .brand-row {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 1rem;
        flex-wrap: wrap;
    }

    .brand {
        font-size: 1.6rem;
        font-weight: 700;
        letter-spacing: 0.08em;
        color: var(--text);
    }
    .brand .accent { color: var(--accent); }

    .back-link {
        font-size: 0.75rem;
        color: var(--text-muted);
        text-decoration: none;
        letter-spacing: 0.05em;
    }
    .back-link:hover { color: var(--text-dim); }

    .meta-row {
        display: flex;
        gap: 1.5rem;
        margin-top: 0.8rem;
        font-size: 0.78rem;
        color: var(--text-dim);
        flex-wrap: wrap;
    }
    .meta-row .chip {
        padding: 4px 10px;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 999px;
    }
    .meta-row .chip strong { color: var(--text); font-weight: 600; margin-left: 4px; }

    .trigger-banner {
        margin-top: 0.9rem;
        padding: 0.6rem 0.9rem;
        background: var(--accent-soft);
        border-left: 3px solid var(--accent);
        border-radius: 4px;
        font-size: 0.82rem;
        color: var(--text);
    }
    .trigger-banner strong { color: var(--accent); letter-spacing: 0.05em; }

    /* ═══ Masonry ═══ */
    .masonry {
        column-count: 3;
        column-gap: 1rem;
    }
    @media (max-width: 900px) { .masonry { column-count: 2; } }
    @media (max-width: 600px) { .masonry { column-count: 1; } }

    .card {
        break-inside: avoid;
        margin-bottom: 1rem;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 10px;
        overflow: hidden;
        transition: border-color 0.2s, transform 0.2s;
    }
    .card:hover { border-color: var(--border-hover); transform: translateY(-2px); }

    .card img {
        display: block;
        width: 100%;
        height: auto;
        background: #111;
    }

    .card-meta {
        padding: 0.7rem 0.85rem 0.85rem;
    }
    .card-tags {
        display: flex;
        gap: 0.35rem;
        align-items: center;
        flex-wrap: wrap;
        margin-bottom: 0.3rem;
    }
    .source-tag {
        font-size: 0.62rem;
        padding: 2px 7px;
        border-radius: 4px;
        letter-spacing: 0.05em;
        font-weight: 600;
    }
    .source-Lookbook     { background: rgba(217,179,122,0.14); color: #d9b37a; border: 1px solid rgba(217,179,122,0.25); }
    .source-时装周        { background: rgba(147,197,253,0.12); color: #93c5fd; border: 1px solid rgba(147,197,253,0.22); }
    .source-日本街拍      { background: rgba(244,114,182,0.12); color: #f472b6; border: 1px solid rgba(244,114,182,0.22); }

    .year-tag {
        font-size: 0.62rem;
        color: var(--text-muted);
        letter-spacing: 0.05em;
    }

    .brand-label {
        font-size: 0.8rem;
        color: var(--text);
        font-weight: 500;
    }

    /* ═══ Empty / skeleton ═══ */
    .empty {
        text-align: center;
        padding: 3rem 1rem;
        color: var(--text-muted);
        font-size: 0.9rem;
    }

    /* ═══ Feedback Bar (固定底部) ═══ */
    .feedback {
        position: fixed;
        bottom: 0; left: 0; right: 0;
        background: rgba(15,15,15,0.92);
        backdrop-filter: saturate(180%) blur(14px);
        -webkit-backdrop-filter: saturate(180%) blur(14px);
        border-top: 1px solid var(--border);
        padding: 0.75rem 1rem;
        z-index: 100;
    }
    .feedback-inner {
        max-width: 1320px;
        margin: 0 auto;
        display: flex;
        gap: 0.6rem;
        align-items: center;
        flex-wrap: wrap;
    }
    .feedback input {
        flex: 1 1 260px;
        min-width: 0;
        background: var(--surface-2);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 0.65rem 0.9rem;
        color: var(--text);
        font-size: 0.88rem;
        outline: none;
    }
    .feedback input:focus { border-color: var(--accent); }
    .feedback input::placeholder { color: var(--text-muted); }

    .feedback button {
        background: var(--accent);
        color: #1a1a1a;
        border: none;
        border-radius: 8px;
        padding: 0.65rem 1.1rem;
        font-weight: 600;
        font-size: 0.85rem;
        cursor: pointer;
        letter-spacing: 0.03em;
        transition: opacity 0.2s;
    }
    .feedback button:hover { opacity: 0.88; }

    .recent-row {
        display: flex;
        gap: 0.4rem;
        align-items: center;
        flex-wrap: wrap;
        width: 100%;
        margin-top: 0.15rem;
    }
    .recent-row .label {
        font-size: 0.7rem; color: var(--text-muted);
        letter-spacing: 0.05em;
    }
    .recent-chip {
        font-size: 0.72rem;
        padding: 3px 8px;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 999px;
        color: var(--text-dim);
        cursor: pointer;
        transition: all 0.2s;
    }
    .recent-chip:hover { color: var(--text); border-color: var(--border-hover); }

    /* ═══ Footer ═══ */
    .footer {
        margin-top: 2.5rem;
        padding-top: 1rem;
        border-top: 1px solid var(--border);
        display: flex;
        justify-content: space-between;
        flex-wrap: wrap;
        gap: 0.5rem;
        font-size: 0.72rem;
        color: var(--text-muted);
        letter-spacing: 0.03em;
    }

    /* modal for 单品搜索 refresh 后的提示（无真实后端时） */
    .toast {
        position: fixed;
        top: 1rem; left: 50%;
        transform: translateX(-50%);
        background: var(--surface);
        border: 1px solid var(--accent);
        color: var(--text);
        padding: 0.7rem 1.1rem;
        border-radius: 8px;
        font-size: 0.82rem;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.3s;
        z-index: 200;
        max-width: 90%;
        line-height: 1.5;
    }
    .toast.show { opacity: 1; }
</style>
</head>
<body>
<div class="container">
    <div class="header">
        <div class="brand-row">
            <div class="brand">Ō<span class="accent">TOMO</span> · OOTD</div>
            <a class="back-link" href="../">← 回到 Ethan's Lab</a>
        </div>
        <div class="meta-row">
            <div class="chip">日期<strong id="today"></strong></div>
            <div class="chip">上海<strong id="weather"></strong></div>
            <div class="chip">方向<strong id="direction"></strong></div>
        </div>
        <div class="trigger-banner"><strong id="triggerLabel">本周推送</strong> · <span id="triggerNote">基于当日天气精选</span></div>
    </div>

    <div class="masonry" id="masonry">
        <!-- cards injected by JS -->
    </div>

    <div class="footer">
        <span>已归档 <strong id="totalCount">0</strong> 套穿搭</span>
        <span>最后更新 <span id="lastUpdate">—</span></span>
    </div>
</div>

<!-- 固定底部反馈栏 -->
<div class="feedback">
    <div class="feedback-inner">
        <input id="queryInput" type="text" placeholder="输入你想穿的单品，立即搜索穿搭，如：米色直筒工装裤" />
        <button id="searchBtn">立即搜索</button>
        <div class="recent-row" id="recentRow"><span class="label">最近搜索</span></div>
    </div>
</div>

<div class="toast" id="toast"></div>

<script>
// === ŌTOMO 前端逻辑 ===
// 数据源：同目录 data/outfit_archive.json
// 所有图片来自 images.unsplash.com（公开 CDN），支持直嵌

const ARCHIVE_URL = './data/outfit_archive.json';
const RECENT_KEY = 'otomo_recent_queries';

let archiveData = null;

function fmtDate(d) {
    const pad = n => String(n).padStart(2, '0');
    return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
}
function fmtDateTime(d) {
    const pad = n => String(n).padStart(2, '0');
    return `${fmtDate(d)} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
}

function showToast(msg, ms=2800) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(()=>t.classList.remove('show'), ms);
}

function renderCards(items) {
    const el = document.getElementById('masonry');
    el.innerHTML = '';
    if (!items.length) {
        el.innerHTML = '<div class="empty">没有匹配到图片 · 请尝试其他关键词</div>';
        return;
    }
    items.forEach(it => {
        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
            <img src="${it.url}?w=700&q=80&auto=format&fit=crop" loading="lazy" alt="${it.brand_or_event}">
            <div class="card-meta">
                <div class="card-tags">
                    <span class="source-tag source-${it.source_type}">${it.source_type}</span>
                    <span class="year-tag">${it.year}</span>
                </div>
                <div class="brand-label">${it.brand_or_event}</div>
            </div>`;
        el.appendChild(card);
    });
}

function pickLatestPush(data) {
    if (!data.pushes || !data.pushes.length) return null;
    // 取最后一次推送
    return data.pushes[data.pushes.length - 1];
}

function renderHeader(data, push, overrides) {
    const now = new Date();
    document.getElementById('today').textContent = fmtDate(now);

    const w = push.weather;
    document.getElementById('weather').textContent =
        `${w.condition} · ${w.temp_c}°C · 体感 ${w.feels_like_c}°C`;
    document.getElementById('direction').textContent =
        (overrides && overrides.direction) || w.direction_keywords.join(' / ');

    if (overrides && overrides.triggerLabel) {
        document.getElementById('triggerLabel').textContent = overrides.triggerLabel;
        document.getElementById('triggerNote').textContent = overrides.triggerNote || '';
    } else {
        const label = push.push_type === 'scheduled' ? '本周推送' : `单品搜索：${push.query || ''}`;
        document.getElementById('triggerLabel').textContent = label;
        document.getElementById('triggerNote').textContent =
            push.push_type === 'scheduled' ? '基于当日天气精选' : '刷新全部瀑布流';
    }

    // 归档总数 = catalog 全部
    document.getElementById('totalCount').textContent = Object.keys(data.catalog || {}).length;
    document.getElementById('lastUpdate').textContent = fmtDateTime(now);
}

function loadArchive() {
    return fetch(ARCHIVE_URL, {cache: 'no-store'})
        .then(r => r.json())
        .then(d => { archiveData = d; return d; });
}

function renderLatest() {
    const push = pickLatestPush(archiveData);
    if (!push) { document.getElementById('masonry').innerHTML = '<div class="empty">归档为空</div>'; return; }
    const items = push.items.map(id => archiveData.catalog[id]).filter(Boolean);
    renderHeader(archiveData, push);
    renderCards(items);
}

function searchByKeyword(kw) {
    if (!archiveData) return;
    const q = kw.trim().toLowerCase();
    if (!q) { renderLatest(); return; }

    // 在 catalog 中按 tags / brand_or_event 模糊匹配
    // 对于没有真实后端来源的第一周版本，检索归档即 "单品模式"
    const all = Object.values(archiveData.catalog);
    const matched = all.filter(it => {
        const hay = (it.brand_or_event + ' ' + (it.tags||[]).join(' ')).toLowerCase();
        return hay.includes(q);
    });

    // 无匹配时，也把 catalog 全量作为"扩展搜索"回退，保证有内容
    const items = matched.length ? matched : all;

    renderHeader(archiveData,
        {push_type:'manual', query:kw, weather: pickLatestPush(archiveData).weather},
        { triggerLabel: `单品搜索：${kw}`,
          triggerNote: matched.length ? `从归档中匹配到 ${matched.length} 张` : `无精准匹配 · 展示归档全景（共 ${all.length} 张）`,
          direction: kw });
    renderCards(items);

    pushRecentQuery(kw);

    if (!matched.length) {
        showToast('当前仅展示第一周归档。自动化推送会持续扩充图库，逐步覆盖更多单品。');
    }
}

// === 最近 5 次搜索 ===
function getRecent() {
    try { return JSON.parse(localStorage.getItem(RECENT_KEY) || '[]'); }
    catch(e) { return []; }
}
function pushRecentQuery(q) {
    let arr = getRecent().filter(x => x !== q);
    arr.unshift(q);
    arr = arr.slice(0, 5);
    localStorage.setItem(RECENT_KEY, JSON.stringify(arr));
    renderRecent();
}
function renderRecent() {
    const row = document.getElementById('recentRow');
    row.querySelectorAll('.recent-chip').forEach(n => n.remove());
    getRecent().forEach(q => {
        const chip = document.createElement('span');
        chip.className = 'recent-chip';
        chip.textContent = q;
        chip.onclick = () => {
            document.getElementById('queryInput').value = q;
            searchByKeyword(q);
        };
        row.appendChild(chip);
    });
}

// === 事件 ===
document.addEventListener('DOMContentLoaded', async () => {
    try {
        await loadArchive();
        renderLatest();
        renderRecent();
        // 归档超 500 提示
        if (Object.keys(archiveData.catalog || {}).length > 500) {
            showToast('归档已超过 500 条，可以考虑整理历史推送。');
        }
    } catch (e) {
        document.getElementById('masonry').innerHTML = '<div class="empty">数据加载失败：' + e.message + '</div>';
    }

    document.getElementById('searchBtn').onclick = () => {
        const v = document.getElementById('queryInput').value;
        if (v.trim()) searchByKeyword(v);
    };
    document.getElementById('queryInput').addEventListener('keydown', (e) => {
        if (e.key === 'Enter') document.getElementById('searchBtn').click();
    });
});
</script>
</body>
</html>
